name: Pipeline Completo (Desafio Aula 10)

# Testes unitarios e de integracao em paralelo; deploy so se tudo passar,
# cobertura > 85% e sem vulnerabilidades no OWASP Dependency-Check.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B clean package -DskipTests

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B test

  integration-tests:
    needs: build
    runs-on: ubuntu-latest   # Docker ja vem instalado (necessario para Testcontainers)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify -Pintegration-tests

  coverage:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      # O pom.xml falha o build se a cobertura de linhas ficar abaixo de 85%
      - run: mvn -B verify

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      # Falha se houver CVE com CVSS >= 7 (ver perfil "security" no pom.xml)
      - run: mvn -B verify -Psecurity -DskipTests
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  deploy:
    needs: [unit-tests, integration-tests, coverage, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3
      - run: echo "Deploy em staging (simulado)"
